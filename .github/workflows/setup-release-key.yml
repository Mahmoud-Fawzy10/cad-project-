name: Initialize MobiCAD Release Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate and securely save release key
        env:
          GH_TOKEN: ${{ secrets.RELEASE_KEY_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pynacl

          python <<'PY'
          import os, json, base64, tempfile, subprocess
          import urllib.request
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          store_pass = os.environ["STORE_PASS"]
          key_pass = os.environ["KEY_PASS"]

          if not all([token, store_pass, key_pass]):
              raise SystemExit(
                  "Missing required repository secrets."
              )

          api = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          existing = request(api + "?per_page=100")
          if any(
              s["name"] == "KEYSTORE_BASE64"
              for s in existing.get("secrets", [])
          ):
              raise SystemExit(
                  "A signing key already exists. Refusing to replace it."
              )

          public = request(api + "/public-key")
          key_id = public["key_id"]
          box = SealedBox(PublicKey(base64.b64decode(public["key"])))

          alias = "mahmoud-apps"

          with tempfile.TemporaryDirectory() as directory:
              keystore = Path(directory) / "mahmoud-apps.jks"

              env = os.environ.copy()
              env["STORE_PASS"] = store_pass
              env["KEY_PASS"] = key_pass

              result = subprocess.run(
                  [
                      "keytool", "-genkeypair",
                      "-keystore", str(keystore),
                      "-storetype", "JKS",
                      "-storepass:env", "STORE_PASS",
                      "-keypass:env", "KEY_PASS",
                      "-alias", alias,
                      "-keyalg", "RSA",
                      "-keysize", "2048",
                      "-validity", "10000",
                      "-dname",
                      "CN=Mahmoud Mohamed Fawzy,O=MobiCAD,C=EG",
                      "-noprompt",
                  ],
                  env=env,
                  capture_output=True,
                  text=True,
              )

              if result.returncode:
                  raise SystemExit(
                      "Key generation failed: " + result.stderr[-1500:]
                  )

              values = {
                  "KEY_ALIAS": alias,
                  "KEYSTORE_BASE64": base64.b64encode(
                      keystore.read_bytes()
                  ).decode("ascii"),
              }

              for name in ["KEY_ALIAS", "KEYSTORE_BASE64"]:
                  encrypted = base64.b64encode(
                      box.encrypt(values[name].encode())
                  ).decode("ascii")

                  request(
                      f"{api}/{name}",
                      method="PUT",
                      payload={
                          "encrypted_value": encrypted,
                          "key_id": key_id,
                      },
                  )
                  print(f"Saved repository secret: {name}")

          print("Release signing key created successfully.")
          PY